[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pygmt-research-agent"
version = "0.1.0a2"
description = "Reproducible regional grid comparisons and geodesic profiles with PyGMT"
requires-python = ">=3.11"
readme = "README.md"
license = {file = "LICENSE"}
dependencies = ["pygmt>=0.14", "numpy", "xarray", "pandas", "netCDF4", "pyproj", "scipy", "Pillow"]

[project.scripts]
pygmt-research = "pygmt_research.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/pygmt-research/skills/pygmt-research" = ["skills/pygmt-research/SKILL.md"]
